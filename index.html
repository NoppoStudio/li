<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoppoLI | NoppoStudio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #1a73e8;
            --bg-light: #f8f9fa;
            --text-main: #202124;
            --font-main: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            --glass-bg: rgba(255, 255, 255, 0.72);
            --glass-border: rgba(26, 115, 232, 0.15);
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-light);
            color: var(--text-main);
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* LiquidGlass Effect */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .noppo-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            transition: all 0.25s ease;
        }

        .noppo-card:hover {
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.05);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .loading-screen {
            position: fixed; inset: 0; background: white; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary:hover {
            background-color: #1557b0;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
        }

        #toast {
            position: fixed; bottom: 32px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #202124; color: white;
            padding: 14px 28px; border-radius: 12px;
            font-size: 14px; z-index: 2000;
            opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="loader" class="loading-screen">
        <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-600 border-t-transparent"></div>
    </div>

    <header class="h-16 border-b border-slate-100 px-6 flex items-center justify-between bg-white/70 backdrop-blur-lg sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-200">
                <i data-lucide="link-2" class="text-white w-5 h-5"></i>
            </div>
            <h1 class="font-bold text-xl tracking-tight text-slate-800">NoppoLI</h1>
        </div>
        
        <div id="auth-section">
            <button id="login-btn" onclick="login()" class="hidden text-sm font-bold text-blue-600 hover:bg-blue-50 px-5 py-2 rounded-full border border-blue-100 transition-all">サインイン</button>
            <div id="user-info" class="hidden items-center gap-3">
                <div class="text-right hidden sm:block">
                    <p id="user-name" class="text-xs font-bold text-slate-800"></p>
                </div>
                <img id="user-avatar" class="w-8 h-8 rounded-full border border-slate-200" alt="User">
                <button onclick="logout()" class="text-slate-400 hover:text-rose-500 transition-colors">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl mx-auto w-full p-6 space-y-12">
        <section class="mt-20 text-center space-y-4">
            <h2 class="text-5xl font-black text-slate-900 tracking-tight">URLを短く、スマートに。</h2>
            <p class="text-slate-500 text-lg">新ドメイン <span class="text-blue-600 font-bold">linp.f5.si</span> でリンクを共有しよう。</p>
            
            <div class="max-w-2xl mx-auto glass-panel p-2 shadow-2xl mt-10">
                <div class="flex flex-col md:flex-row gap-2 items-center">
                    <div class="flex-1 w-full relative">
                        <input type="text" id="long-url" placeholder="長いURLをここにペースト" class="w-full px-6 py-4 bg-transparent outline-none text-base placeholder:text-slate-400">
                    </div>
                    <button id="submit-btn" onclick="createShortLink()" class="btn-primary w-full md:w-auto px-10 py-4 rounded-xl font-bold text-sm tracking-wide shadow-blue-100">
                        短縮する
                    </button>
                </div>
            </div>

            <div id="custom-id-container" class="hidden mt-6 animate-in fade-in slide-in-from-top-3 duration-500">
                <div class="inline-flex items-center gap-2 px-4 py-2 bg-white/50 border border-dashed border-slate-300 rounded-xl mx-auto">
                    <span class="text-xs font-bold text-slate-400">linp.f5.si/?i=</span>
                    <input type="text" id="custom-short-id" placeholder="カスタムID" class="bg-transparent outline-none text-sm text-blue-600 font-bold w-32" maxlength="20">
                </div>
            </div>

            <p id="guest-notice" class="text-[11px] text-slate-400 mt-6 hidden">
                <i data-lucide="shield-alert" class="w-3.5 h-3.5 inline mr-1"></i> ログインなしの場合、リンクは1ヶ月で消去されます。
            </p>
        </section>

        <section>
            <div class="flex items-center justify-between mb-8">
                <h3 class="text-xs font-black text-slate-400 uppercase tracking-[0.2em] flex items-center gap-2">
                    <i data-lucide="clock" class="w-4 h-4"></i> 最近のリンク
                </h3>
                <div id="stats-summary" class="text-xs font-bold text-blue-600 bg-blue-50 px-4 py-1.5 rounded-full border border-blue-100"></div>
            </div>
            <div id="links-list" class="grid gap-4"></div>
        </section>
    </main>

    <div id="detail-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center hidden z-[1000]">
        <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl border border-white/20">
            <div class="flex justify-between items-start mb-8">
                <h3 class="font-bold text-2xl text-slate-900">作成完了！</h3>
                <button onclick="closeModal()" class="p-1 hover:bg-slate-100 rounded-lg transition-colors"><i data-lucide="x" class="w-6 h-6 text-slate-400"></i></button>
            </div>
            <div class="space-y-8">
                <div class="p-8 bg-slate-50 border border-slate-100 rounded-2xl text-center cursor-pointer group" onclick="copyToClipboard()">
                    <p id="result-short-url" class="text-2xl font-black text-blue-600 break-all select-all"></p>
                    <div class="flex items-center justify-center gap-2 mt-4 text-slate-400 group-hover:text-blue-500 transition-colors">
                        <i data-lucide="copy" class="w-4 h-4"></i>
                        <span class="text-[10px] font-bold uppercase tracking-widest">Click to Copy</span>
                    </div>
                </div>
                <div class="flex gap-4">
                    <button onclick="copyToClipboard()" class="flex-1 btn-primary py-4 rounded-2xl font-bold text-sm">コピー</button>
                    <button onclick="downloadQR()" class="flex-1 border border-slate-200 py-4 rounded-2xl font-bold text-sm text-slate-600 hover:bg-slate-50 transition-all">QRコード</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast">コピーしました</div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

    <script>
        // NoppoAuth Config
        const AUTH_URL = "https://noppo-auth.noppo5319.workers.dev";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2YXZhc3JkeGd1cWtpaWdjeGtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0MTk5ODcsImV4cCI6MjA4Mjk5NTk4N30.CVq3lyRbxek7Ejs4tP5sN9-0JNEXSLtCsC2Pj-skFFQ";
        const SITE_DOMAIN = "https://linp.f5.si"; 
        
        const firebaseConfig = {
            apiKey: "AIzaSyB2HcI-TwH88QDADp-Z5cUFRCsaVO2VMw0",
            authDomain: "portal-1767266387985.firebaseapp.com",
            projectId: "portal-1767266387985",
            appId: "1:931194072772:web:f97c2e7e1ac1eb301d6391"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const APP_ID = "noppo_li_v2";
        let currentUser = null;

        function login() {
            var currentUrl = encodeURIComponent(window.location.href);
            window.location.href = AUTH_URL + "?redirect=" + currentUrl;
        }

        async function checkAuth() {
            var urlParams = new URLSearchParams(window.location.search);
            var ticket = urlParams.get('ticket');
            if (ticket) {
                try {
                    var response = await fetch(AUTH_URL + "/auth/v1/user?ticket=" + ticket, {
                        method: 'GET',
                        headers: { 'apikey': SUPABASE_KEY }
                    });
                    if (response.ok) {
                        var user = await response.json();
                        window.history.replaceState({}, document.title, window.location.origin + window.location.pathname);
                        return user; 
                    }
                } catch (e) { console.error("Auth Fetch Error:", e); }
            }
            return null;
        }

        function logout() {
            localStorage.removeItem('noppo_li_user');
            window.location.href = AUTH_URL + "/logout?redirect=" + encodeURIComponent(window.location.origin);
        }

        async function init() {
            if (await handleRedirect()) return;

            var user = await checkAuth();
            var loginBtn = document.getElementById('login-btn');
            var userInfo = document.getElementById('user-info');

            if (user) {
                currentUser = { 
                    uid: user.id || user.userId, 
                    name: user.user_metadata ? user.user_metadata.display_name : (user.userId || "No Name"),
                    avatar: user.user_metadata ? user.user_metadata.avatar_url : (user.avatar || "https://api.dicebear.com/7.x/initials/svg?seed=" + user.email),
                    isGuest: false 
                };
                localStorage.setItem('noppo_li_user', JSON.stringify(currentUser));
                document.getElementById('user-name').innerText = currentUser.name;
                document.getElementById('user-avatar').src = currentUser.avatar;
                userInfo.style.display = 'flex';
                document.getElementById('custom-id-container').classList.remove('hidden');
            } else {
                var saved = localStorage.getItem('noppo_li_user');
                if (saved) {
                    currentUser = JSON.parse(saved);
                    document.getElementById('user-name').innerText = currentUser.name;
                    document.getElementById('user-avatar').src = currentUser.avatar;
                    userInfo.style.display = 'flex';
                    if (!currentUser.isGuest) document.getElementById('custom-id-container').classList.remove('hidden');
                } else {
                    currentUser = { uid: 'guest_' + Math.random().toString(36).substring(2, 10), name: 'ゲスト', isGuest: true };
                    loginBtn.style.display = 'block';
                    document.getElementById('guest-notice').classList.remove('hidden');
                }
            }
            document.getElementById('loader').classList.add('hidden');
            listenLinks();
            lucide.createIcons();
        }

        async function createShortLink() {
            var btn = document.getElementById('submit-btn');
            var longUrl = document.getElementById('long-url').value.trim();
            if (!longUrl) return;
            try { new URL(longUrl); } catch(e) { showToast("URLの形式が正しくありません"); return; }

            btn.disabled = true;
            btn.innerText = "作成中...";
            
            var customId = document.getElementById('custom-short-id').value.trim();
            var shortId = (!currentUser.isGuest && customId) 
                ? customId.replace(/[^a-zA-Z0-9_-]/g, "")
                : Math.random().toString(36).substring(2, 7);

            var expiresAt = null;
            if (currentUser.isGuest) {
                var d = new Date(); 
                d.setMonth(d.getMonth() + 1);
                expiresAt = firebase.firestore.Timestamp.fromDate(d);
            }

            try {
                await db.collection("artifacts").doc(APP_ID).collection("links").add({
                    shortId: shortId,
                    longUrl: longUrl,
                    authorUid: currentUser.uid,
                    clicks: 0,
                    isGuest: currentUser.isGuest,
                    expiresAt: expiresAt,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('long-url').value = "";
                showModal(shortId);
            } catch (e) { showToast("保存に失敗しました"); } finally { btn.disabled = false; btn.innerText = "短縮する"; }
        }

        function listenLinks() {
            if (!currentUser) return;
            db.collection("artifacts").doc(APP_ID).collection("links")
                .where("authorUid", "==", currentUser.uid)
                .onSnapshot(function(snap) {
                    var links = [];
                    snap.forEach(function(doc) {
                        var data = doc.data();
                        data.id = doc.id;
                        links.push(data);
                    });
                    renderLinks(links);
                });
        }

        function renderLinks(links) {
            var list = document.getElementById('links-list');
            list.innerHTML = "";
            if (links.length === 0) {
                list.innerHTML = '<div class="py-24 text-center border-2 border-dashed border-slate-100 rounded-3xl bg-white text-slate-300 font-bold">まだ履歴がありません</div>';
                document.getElementById('stats-summary').innerText = "0 links";
                return;
            }
            
            links.sort(function(a, b) {
                return (b.createdAt ? b.createdAt.seconds : 0) - (a.createdAt ? a.createdAt.seconds : 0);
            });
            
            var totalClicks = 0;
            links.forEach(function(l) { totalClicks += (l.clicks || 0); });
            document.getElementById('stats-summary').innerText = links.length + " links · " + totalClicks + " clicks";

            links.forEach(function(link) {
                var item = document.createElement('div');
                item.className = "noppo-card p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-6 group";
                var shortUrl = SITE_DOMAIN + "/?i=" + link.shortId;
                item.innerHTML = '\
                    <div class="flex-1 min-w-0">\
                        <div class="flex items-center gap-2 mb-1.5"><span class="font-bold text-blue-600 text-lg truncate">' + shortUrl + '</span></div>\
                        <div class="text-xs text-slate-400 truncate font-medium">' + link.longUrl + '</div>\
                    </div>\
                    <div class="flex items-center gap-8">\
                        <div class="text-right"><p class="text-[9px] text-slate-300 font-black uppercase tracking-widest">Total Clicks</p><p class="text-2xl font-black text-slate-800">' + (link.clicks || 0) + '</p></div>\
                        <div class="flex gap-1">\
                            <button onclick="copyToClipboard(\'' + shortUrl + '\')" class="p-2.5 text-slate-300 hover:text-blue-600 transition-colors"><i data-lucide="copy" class="w-5 h-5"></i></button>\
                            <button onclick="deleteLink(\'' + link.id + '\')" class="p-2.5 text-slate-300 hover:text-rose-500 transition-colors"><i data-lucide="trash-2" class="w-5 h-5"></i></button>\
                        </div>\
                    </div>';
                list.appendChild(item);
            });
            lucide.createIcons();
        }

        async function deleteLink(id) { 
            if (confirm("このリンクを削除してもよろしいですか？")) {
                await db.collection("artifacts").doc(APP_ID).collection("links").doc(id).delete(); 
            }
        }

        function showModal(id) { 
            document.getElementById('result-short-url').innerText = SITE_DOMAIN + "/?i=" + id; 
            document.getElementById('detail-modal').classList.remove('hidden'); 
            lucide.createIcons(); 
        }

        function closeModal() { document.getElementById('detail-modal').classList.add('hidden'); }
        
        function copyToClipboard(t) { 
            var text = t || document.getElementById('result-short-url').innerText;
            navigator.clipboard.writeText(text).then(function() { showToast("クリップボードにコピーしました"); }); 
        }

        function showToast(m) { 
            var t = document.getElementById('toast'); 
            t.innerText = m; 
            t.classList.add('show'); 
            setTimeout(function() { t.classList.remove('show'); }, 3000); 
        }

        function downloadQR() { 
            var url = document.getElementById('result-short-url').innerText;
            window.open("https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=" + encodeURIComponent(url)); 
        }

        async function handleRedirect() {
            var p = new URLSearchParams(window.location.search);
            var id = p.get('i');
            if (id && !p.has('ticket')) {
                var snap = await db.collection("artifacts").doc(APP_ID).collection("links").where("shortId", "==", id).limit(1).get();
                if (!snap.empty) {
                    var doc = snap.docs[0]; 
                    var data = doc.data();
                    if (data.expiresAt && new Date() > data.expiresAt.toDate()) { 
                        alert("有効期限が切れています。"); 
                        await doc.ref.delete(); 
                    } else { 
                        await doc.ref.update({ clicks: firebase.firestore.FieldValue.increment(1) }); 
                        window.location.replace(data.longUrl); 
                        return true; 
                    }
                } else { alert("リンクが見つかりませんでした。"); }
                window.history.replaceState({}, "", window.location.pathname);
            }
            return false;
        }
        window.onload = init;
    </script>
</body>
</html>
